spring.application.name=webapp
server.port=8082
# ici, on met l'URL de la gateway et non l'URL du microservice Patient.
medilabo.url.api=http://localhost:8080/api
# API REST .....................................................................
# Ne pas exposer les details des erreurs.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
# desactiver la page HTML des erreurs.
server.error.whitelabel.enabled=false


