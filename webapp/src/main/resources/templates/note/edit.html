<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Ajouter une note</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container my-4">
  <h1 class="mb-4">
    Add new note for :  
    <span th:text="${patient.lastName}"></span>
    <span th:text="${patient.firstName}"></span>
  </h1>

  <form th:action="@{/notes}" method="post" th:object="${note}" class="row g-3">
    <!-- patientId en hidden (déjà connu) -->
    <input type="hidden" th:field="*{patientId}"/>

    <div class="col-12">
      <label class="form-label">Content</label>
      <textarea th:field="*{content}" rows="8" class="form-control" autofocus></textarea>
      <small class="form-text text-muted">Mandatory</small>
      <div class="text-danger" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
    </div>

    <div class="col-12">
      <a th:href="@{'/notes/patient/' + ${note.patientId}}" class="btn btn-danger">Cancel</a>
      <button type="submit" class="btn btn-primary">Create</button>
    </div>
  </form>
</body>
</html>
