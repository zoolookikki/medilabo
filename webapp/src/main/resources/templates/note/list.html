<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Notes du patient</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container my-4">
  <h1 class="mb-4">
    Patient notes :  
    <span th:text="${patient.lastName}"></span>
    <span th:text="${patient.firstName}"></span>
  </h1>

  <!-- Flash messages -->
  <div th:if="${successMessage}" class="alert alert-success" role="alert">
    <span th:text="${successMessage}"></span>
  </div>
  <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
    <span th:text="${errorMessage}"></span>
  </div>

  <div class="mb-3">
    <a th:href="@{'/notes/add/' + ${patient.id}}" class="btn btn-primary btn-sm">Add new note</a>
    <a href="/patients" class="btn btn-secondary btn-sm ms-2">Back to patient list</a>
  </div>

  <table class="table table-striped table-hover">
    <thead class="table-light">
      <tr>
        <th>Creation date</th>
        <th>Content</th>
      </tr>
    </thead>
    <tbody>
      <tr th:if="${#lists.isEmpty(notes)}">
        <td colspan="2" class="text-center fst-italic">No notes found.</td>
      </tr>
      <tr th:each="note : ${notes}">
        <!-- pour que l'heure soit collée à la date -->
        <td style="white-space: nowrap;" th:text="${#temporals.format(note.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
        <!-- préserve les retours à la ligne ainsi que les espaces multiples -->
        <td style="white-space: pre-wrap;" th:text="${note.content}"></td>
      </tr>
    </tbody>
  </table>

</body>
</html>
