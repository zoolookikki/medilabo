<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${isUpdate} ? 'Edit Patient' : 'Create Patient'"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Orange Bootstrap (#fd7e14) avec texte lisible */
    .badge.text-bg-orange {
      background-color: var(--bs-orange, #fd7e14) !important;
      color: #fff !important;
    }
  </style>  
</head>
<body class="container my-4">
  <h1 class="mb-4">
    <span th:text="${isUpdate} ? 'Edit Patient : ' : 'Create Patient'"></span>
    <span th:if="${isUpdate}"
          th:text="${patient.lastName + ' ' + patient.firstName}"></span>
  </h1>

  <div class="mb-3" th:if="${isUpdate}">
    <span class="fw-semibold">Diabetes Risk Assessment : </span>
    <!-- HS ?? <span th:case="${T(com.medilabo.webapp.dto.RiskLevel).NONE}"        class="badge bg-success">None</span> --> 
    <span th:switch="${riskLevel.name()}">
      <!-- Vert -->
      <span th:case="'NONE'"        class="badge text-bg-success">None</span>
      <!-- Jaune -->
      <span th:case="'BORDERLINE'"  class="badge text-bg-warning">Borderline</span>
      <!-- Orange (custom) -->
      <span th:case="'IN_DANGER'"   class="badge text-bg-orange">In&nbsp;Danger</span>
      <!-- Rouge -->
      <span th:case="'EARLY_ONSET'" class="badge text-bg-danger">Early&nbsp;Onset</span>
    </span>
  </div>
           
  <form th:action="${isUpdate} ? @{/patients/{id}/edit(id=${updateId})} : @{/patients}"
        method="post"
        th:object="${patient}"
        class="row g-3">

    <div class="col-md-6">
      <label class="form-label">Last Name</label>
      <input type="text" th:field="*{lastName}" class="form-control" autofocus>
      <small class="form-text text-muted">Mandatory and not exceed 50 characters</small>      
      <div class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
    </div>

    <div class="col-md-6">
      <label class="form-label">First Name</label>
      <input type="text" th:field="*{firstName}" class="form-control">
      <small class="form-text text-muted">Mandatory and not exceed 50 characters</small>      
      <div class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
    </div>

    <div class="col-md-6">
      <label class="form-label">Date of Birth</label>
      <!-- LocalDate -->
      <!-- Le champ <input type="date"> exige une valeur ISO (yyyy-MM-dd) 
           Grâce à @DateTimeFormat(iso=ISO.DATE) dans PatientDTO, Spring génère et parse
           correctement ce format, ce qui permet à la date de s’afficher et d’être éditée. -->
      <input type="date" th:field="*{birthDate}" class="form-control">
      <small class="form-text text-muted">Mandatory</small>      
      <div class="text-danger" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
    </div>

    <div class="col-md-6">
      <label class="form-label">Gender</label>
      <select th:field="*{gender}" class="form-select">
      <option th:each="g : ${T(com.medilabo.webapp.dto.Gender).values()}"
        th:value="${g}"
        th:text="${g}"></option>
      </select>
      <div class="text-danger" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
    </div>

    <div class="col-12">
      <label class="form-label">Address</label>
      <input type="text" th:field="*{address}" class="form-control">
      <small class="form-text text-muted">Can be empty or not exceed 255 characters</small>      
      <div class="text-danger" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
    </div>

    <div class="col-12">
      <label class="form-label">Phone</label>
      <input type="text" th:field="*{phoneNumber}" class="form-control">
      <small class="form-text text-muted">Can be empty or in the format XXX-XXX-XXXX (digits only)</small>      
      <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
    </div>

    <div class="col-12">
      <a href="/patients" class="btn btn-danger">Cancel</a>
      <button type="submit" class="btn btn-primary"
              th:text="${isUpdate} ? 'Update' : 'Create'"></button>
    </div>

  </form>
</body>
</html>
