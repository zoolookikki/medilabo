<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Patient List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container my-4">
  <h1 class="mb-4">Patient List</h1>

  <!-- Flash (provenant de RedirectAttributes) -->
  <div th:if="${successMessage}" class="alert alert-success" role="alert">
    <span th:text="${successMessage}"></span>
  </div>  
  <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
    <span th:text="${errorMessage}"></span>
  </div>  
  
  <a href="/patients/add" class="btn btn-primary btn-sm">Add new patient</a>
  <form th:action="@{/logout}" method="post" class="d-inline">
    <button type="submit" class="btn btn-secondary btn-sm">Logout</button> 
  </form>
  
  <table class="table table-striped table-hover">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Last Name</th>
        <th>First Name</th>
        <th>Date of Birth</th>
        <th>Gender</th>
        <th>Address</th>
        <th>Phone</th>
      </tr>
    </thead>
    <tbody>
      <tr th:if="${#lists.isEmpty(patients)}">
        <td colspan="7" class="text-center fst-italic">No patients found.</td>
      </tr>
      <tr th:each="patient : ${patients}">
        <td th:text="${patient.id}"></td>
        <td th:text="${patient.lastName}"></td>
        <td th:text="${patient.firstName}"></td>
        <!-- LocalDate -->
        <!-- On utilise #temporals.format pour afficher la date dans un format lisible (dd/MM/yyyy) car le type date n'existe pas ici -->
        <td th:text="${#temporals.format(patient.birthDate, 'dd/MM/yyyy')}"></td> 
        <td th:text="${patient.gender}"></td>
        <td th:text="${patient.address}"></td>
        <td th:text="${patient.phoneNumber}"></td>
        <td>
            <a th:href="@{'/patients/' + ${patient.id}}">Edit | </a>
            <a th:href="@{'/notes/patient/' + ${patient.id}}">Notes</a>
        </td>
        </tr>
    </tbody>
  </table>
</body>
</html>
