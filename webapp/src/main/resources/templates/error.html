<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Error</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container my-5">
  <div class="alert alert-danger">
    <h1 class="h3 mb-3">Something went wrong</h1>
    <p th:text="${message} ?: 'The service is temporarily unavailable.'"></p>
    <p th:if="${status}" class="text-muted">Status: <span th:text="${status}"></span></p>
    <a href="/" class="btn btn-outline-primary mt-2">Back to home</a>
  </div>
</body>
</html>
